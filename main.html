<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MZK Koszalin">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<title>MZK Koszalin</title>

<style>
:root {
    --blue: #28467f;
    --cyan: #08acd2;
    --green: #24b44b;
    --muted: #9aa4b8;
    --card: #f3f6f9;
    --nav-height: 5.6rem;
}

* { box-sizing: border-box; }

html {
    margin: 0;
    background: #fff;
    font-family: Roboto, "Noto Sans", system-ui, -apple-system, sans-serif;
    color: var(--blue);
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100dvh;
    background: #fff;
}

.app {
    min-height: 100dvh;
    padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom));
}

/* Sticky logo bar: it remains visible in the lower screenshot while the page scrolls. */
.topbar {
    position: sticky;
    z-index: 20;
    top: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 7.8rem;
    padding: 0.7rem 1.25rem 0.25rem;
    background: rgba(255,255,255,.98);
}

.logo {
    display: block;
    width: min(31vw, 17rem);
    height: auto;
}

/* Main content */
.content {
    width: 100%;
    max-width: 64rem;
    margin: 0 auto;
    padding: 0 6.2vw 2rem;
}

.section-title {
    margin: 0;
    padding: 0.45rem 0 1.45rem;
    font-size: clamp(1.7rem, 5.1vw, 2.55rem);
    line-height: 1.1;
    font-weight: 500;
    letter-spacing: -0.02em;
}

.ticket-card {
    position: relative;
    display: grid;
    grid-template-columns: 0.7rem 1fr;
    min-height: 20rem;
    overflow: hidden;
    border: 0.28rem solid var(--cyan);
    border-radius: 1.5rem;
    background: var(--card);
}

.ticket-accent {
    background: var(--cyan);
}

.ticket-inner {
    position: relative;
    padding: 1.65rem 1.25rem 1.2rem;
}

.ticket-zone {
    margin: 0 0 0.9rem;
    font-size: clamp(1.45rem, 4.2vw, 2rem);
    line-height: 1;
    font-weight: 400;
}

.ticket-type {
    margin: 0 0 0.8rem;
    font-size: clamp(1.35rem, 4vw, 1.9rem);
    line-height: 1.1;
    font-weight: 400;
}

.ticket-subtitle {
    margin: 0;
    color: var(--muted);
    font-size: clamp(1.05rem, 3.1vw, 1.45rem);
    line-height: 1.15;
    font-weight: 400;
}

.ticket-status {
    position: absolute;
    top: 1.65rem;
    right: 1.2rem;
    text-align: right;
}

.active {
    display: block;
    margin-bottom: 0.7rem;
    color: var(--green);
    font-size: clamp(1.45rem, 4.1vw, 2rem);
    line-height: 1;
    font-weight: 500;
}

.duration {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    color: var(--blue);
    font-size: clamp(1.15rem, 3.5vw, 1.55rem);
    line-height: 1;
    font-weight: 500;
}

.clock {
    width: 1.4rem;
    aspect-ratio: 1;
    border: 0.18rem solid currentColor;
    border-radius: 50%;
    position: relative;
    flex: 0 0 auto;
}

.clock::before {
    content: "";
    position: absolute;
    width: 0.18rem;
    height: 0.42rem;
    left: calc(50% - 0.09rem);
    top: 0.2rem;
    background: currentColor;
    border-radius: 1rem;
}

.clock::after {
    content: "";
    position: absolute;
    width: 0.38rem;
    height: 0.18rem;
    left: 50%;
    top: calc(50% - 0.09rem);
    background: currentColor;
    border-radius: 1rem;
}

.details {
    display: block;
    width: 64%;
    max-width: 33rem;
    margin: 2rem auto 4.25rem;
    padding: 0.95rem 1.25rem;
    border: 0;
    border-radius: 4rem;
    background: linear-gradient(100deg, #42468c, #633c77);
    color: #fff;
    font: inherit;
    font-size: clamp(1.35rem, 4.1vw, 1.95rem);
    line-height: 1;
    font-weight: 500;
    text-align: center;
}

.news-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 1.2rem;
}

.news-heading .section-title {
    padding-bottom: 0;
}

.filter {
    width: 3.4rem;
    height: 3.4rem;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    background: transparent;
}

.filter svg {
    width: 2.7rem;
    height: 2.7rem;
    stroke: var(--blue);
    fill: none;
    stroke-width: 0.22rem;
    stroke-linecap: round;
}

.card-image {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 1.4rem;
    object-fit: cover;
}

.news-image {
    margin-bottom: 3.8rem;
}

.bus-image {
    margin-top: 0.2rem;
    margin-bottom: 1rem;
}

/* Bottom navigation */
.bottom-nav {
    position: fixed;
    z-index: 30;
    left: 0;
    right: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    min-height: var(--nav-height);
    padding: 0.35rem 0.8rem calc(0.25rem + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.98);
    border-top: 0.12rem solid #e4e8ee;
    box-shadow: 0 -0.15rem 0.5rem rgba(0,0,0,.04);
}

.nav-item {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.22rem;
    min-width: 0;
    padding: 0.25rem 0.1rem;
    border: 0;
    background: transparent;
    color: #9ba4b7;
    font: inherit;
    font-size: clamp(0.92rem, 3.2vw, 1.3rem);
    line-height: 1;
    font-weight: 400;
}

.nav-item.active-nav {
    color: var(--blue);
}

.nav-item.active-nav::before {
    content: "";
    position: absolute;
    top: -0.35rem;
    left: -0.8rem;
    right: -0.8rem;
    height: 0.12rem;
    background: var(--blue);
}

.nav-icon {
    width: 2.7rem;
    height: 2.7rem;
    display: grid;
    place-items: center;
}

.nav-icon svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    fill: none;
    stroke-width: 0.15rem;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.ticket-count {
    position: absolute;
    top: 0.8rem;
    margin-left: 2rem;
    display: grid;
    place-items: center;
    width: 1.7rem;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #17b94d;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 500;
}

@media (max-width: 26rem) {
    :root { --nav-height: 5.25rem; }
    .topbar { min-height: 7.2rem; }
    .content { padding-inline: 5.6vw; }
    .ticket-card { min-height: 18rem; }
    .ticket-status { position: static; margin-top: 1.1rem; text-align: left; }
    .duration { justify-content: flex-start; }
    .details { width: 70%; margin-bottom: 3.5rem; }
}

@media (min-width: 48rem) {
    .content { padding-inline: 4rem; }
    .topbar { min-height: 8rem; }
}
</style>
</head>

<body>
<div class="app">
    <header class="topbar">
        <img class="logo" src="logo.png" alt="MZK Koszalin">
    </header>

    <main class="content">
        <section aria-labelledby="active-title">
            <h1 id="active-title" class="section-title">Active tickets</h1>

            <article class="ticket-card">
                <div class="ticket-accent"></div>
                <div class="ticket-inner">
                    <p class="ticket-zone">Zone A</p>
                    <p class="ticket-type">Reduced periodic</p>
                    <p class="ticket-subtitle">Bilet 30-dniowy imienny</p>

                    <div class="ticket-status">
                        <span class="active">Active</span>
                        <span class="duration"><span class="clock" aria-hidden="true"></span>10d 22h</span>
                    </div>
                </div>
            </article>

            <button class="details" type="button">SHOW DETAILS</button>
        </section>

        <section aria-labelledby="news-title">
            <div class="news-heading">
                <h2 id="news-title" class="section-title">News</h2>
                <button class="filter" type="button" aria-label="Filter news">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <circle cx="8" cy="10" r="4"></circle>
                        <path d="M18 10h24"></path>
                        <circle cx="8" cy="24" r="4"></circle>
                        <path d="M18 24h24"></path>
                        <circle cx="8" cy="38" r="4"></circle>
                        <path d="M18 38h16"></path>
                    </svg>
                </button>
            </div>

            <img class="card-image news-image" src="news-card.png" alt="News: Aktualizacja regulaminu od 10/09/2026">

            <h2 class="section-title">Bus schedule</h2>
            <img class="card-image bus-image" src="bus-card.png" alt="Information about actual time of bus arrival">
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active-nav" type="button">
            <span class="nav-icon">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M7 22 24 7l17 15v19H29V29H19v12H7Z" fill="currentColor" stroke="none"></path>
                </svg>
            </span>
            <span>START</span>
        </button>

        <button class="nav-item" type="button">
            <span class="nav-icon">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M15 9h23v25H15Z"></path>
                    <path d="M10 14v25h23"></path>
                    <path d="M26 15v13M19.5 21.5h13"></path>
                </svg>
            </span>
            <span>BUY TICKET</span>
        </button>

        <button class="nav-item" type="button">
            <span class="nav-icon">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <rect x="14" y="8" width="27" height="31" rx="4"></rect>
                    <path d="M21 17h13M21 24h13M21 31h8"></path>
                </svg>
            </span>
            <span class="ticket-count">1</span>
            <span>MY TICKETS</span>
        </button>

        <button class="nav-item" type="button">
            <span class="nav-icon">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <circle cx="9" cy="24" r="3" fill="currentColor" stroke="none"></circle>
                    <circle cx="24" cy="24" r="3" fill="currentColor" stroke="none"></circle>
                    <circle cx="39" cy="24" r="3" fill="currentColor" stroke="none"></circle>
                </svg>
            </span>
            <span>MENU</span>
        </button>
    </nav>
</div>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
}
</script>
</body>
</html>
