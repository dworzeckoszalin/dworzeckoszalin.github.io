<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PIN Lock</title>
<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    color: #304981;
}

.app {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 100%;
    background: #ffffff;
}

/* PIN section */
.pin-area {
    position: absolute;
    top: 27%;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    text-align: center;
}

.boxes {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 11px;
}

.box {
    width: 68px;
    height: 82px;
    border: 2px solid #d8deeb;
    border-radius: 17px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #304981;
    font-size: 30px;
    font-weight: 400;
}

.message {
    margin-top: 48px;
    padding: 0 15px;
    font-size: 20px;
    line-height: 1.3;
    white-space: nowrap;
}

/* More options */
.more {
    position: absolute;
    left: 50%;
    bottom: 24%;
    transform: translateX(-50%);
    border: 0;
    white-space: nowrap;
    outline: 0;
    background: transparent;
    color: #304981;
    font-size: 21px;
    font-weight: 700;
    padding: 12px 18px;
    white-space: nowrap;
    cursor: pointer;
}

/* Dark overlay */
.scrim {
    position: fixed;
    z-index: 10;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.58);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease;
}

/* Bottom menu */
.sheet {
    position: fixed;
    z-index: 11;
    left: 0;
    right: 0;
    bottom: 0;
    background: #ffffff;
    border-radius: 21px 21px 0 0;
    padding: 18px 20px 25px;
    transform: translateY(110%);
    transition: transform 0.22s ease;
}

.sheet.open {
    transform: translateY(0);
}

.scrim.open {
    opacity: 1;
    visibility: visible;
}

.cancel {
    height: 65px;
    display: flex;
    align-items: center;
    gap: 36px;
    color: #304981;
    font-size: 24px;
    font-weight: 600;
    cursor: pointer;
}

.x {
    width: 54px;
    text-align: center;
    color: #a64d52;
    font-size: 37px;
    font-weight: 300;
}

.divider {
    height: 2px;
    width: 100%;
    background: #999999;
    margin-bottom: 10px;
}

.option {
    height: 82px;
    display: flex;
    align-items: center;
    color: #304981;
    font-size: 22px;
    cursor: pointer;
}

.icon {
    width: 92px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
}

/* Fingerprint icon */
.fingerprint {
    position: relative;
    width: 38px;
    height: 45px;
    border: 2px solid #304981;
    border-bottom-color: transparent;
    border-radius: 50%;
}

.fingerprint:before {
    content: "";
    position: absolute;
    left: 6px;
    right: 6px;
    top: 7px;
    bottom: 4px;
    border: 2px solid #304981;
    border-bottom-color: transparent;
    border-radius: 50%;
}

.fingerprint:after {
    content: "";
    position: absolute;
    left: 12px;
    right: 12px;
    top: 15px;
    bottom: 2px;
    border: 2px solid #304981;
    border-bottom-color: transparent;
    border-radius: 50%;
}

.reset-icon {
    font-size: 42px;
    line-height: 1;
    transform: rotate(-20deg);
}

.star-icon {
    font-size: 30px;
    font-weight: bold;
}

/* Error animation */
.error .box {
    border-color: #b65a60;
}

@media (max-width: 360px) {
    .message {
        font-size: 19px;
    }

    .option {
        font-size: 20px;
    }
}

@media (min-width: 600px) {
    .pin-area {
        top: 30%;
    }

    .message {
        margin-top: 58px;
    }

    .more {
        font-size: 27px;
    }
}
</style>
</head>

<body>
<div class="app" id="app">

    <div class="pin-area" id="pinArea">
        <div class="boxes">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <div class="message">Enter PIN to unlock the application.</div>
    </div>

    <button class="more" id="more">MORE OPTIONS</button>

    <div class="scrim" id="scrim"></div>

    <div class="sheet" id="sheet">
        <div class="cancel" id="cancel">
            <div class="x">×</div>
            <div>Cancel</div>
        </div>

        <div class="divider"></div>

        <div class="option" id="fingerprint">
            <div class="icon">
                <div class="fingerprint"></div>
            </div>
            <div>Use fingerprint</div>
        </div>

        <div class="option" id="reset">
            <div class="icon">
                <div class="reset-icon">↶</div>
            </div>
            <div>Reset PIN</div>
        </div>

        <div class="option" id="password">
            <div class="icon">
                <div class="star-icon">*</div>
            </div>
            <div>Sign in by password</div>
        </div>
    </div>

    <input id="pinInput"
           type="tel"
           inputmode="numeric"
           maxlength="4"
           autocomplete="off"
           style="position:fixed;left:-10000px;top:-10000px;opacity:0;">
</div>

<script>
(function () {
    const CORRECT_PIN = "0000";

    const app = document.getElementById("app");
    const boxes = document.querySelectorAll(".box");
    const pinInput = document.getElementById("pinInput");

    const more = document.getElementById("more");
    const sheet = document.getElementById("sheet");
    const scrim = document.getElementById("scrim");
    const cancel = document.getElementById("cancel");
    const reset = document.getElementById("reset");

    let pin = "";

    function updateBoxes() {
        boxes.forEach(function (box, index) {
            box.textContent = index < pin.length ? "*" : "";
        });
    }

    function focusInput() {
        pinInput.focus();
    }

    function clearPin() {
        pin = "";
        pinInput.value = "";
        updateBoxes();
    }

    function checkPin() {
        if (pin === CORRECT_PIN) {
            // Correct PIN -> open main.html
            window.location.href = "main.html";
        } else {
            app.classList.add("error");

            setTimeout(function () {
                app.classList.remove("error");
                clearPin();
                focusInput();
            }, 450);
        }
    }

    function openMenu() {
        sheet.classList.add("open");
        scrim.classList.add("open");
        pinInput.blur();
    }

    function closeMenu() {
        sheet.classList.remove("open");
        scrim.classList.remove("open");
        focusInput();
    }

    pinInput.addEventListener("input", function () {
        pin = pinInput.value.replace(/[^0-9]/g, "").substring(0, 4);
        pinInput.value = pin;

        updateBoxes();

        if (pin.length === 4) {
            setTimeout(checkPin, 80);
        }
    });

    document.addEventListener("keydown", function (event) {
        if (event.key >= "0" && event.key <= "9") {
            if (pin.length < 4) {
                pin += event.key;
                pinInput.value = pin;
                updateBoxes();

                if (pin.length === 4) {
                    checkPin();
                }
            }
        }

        if (event.key === "Backspace") {
            pin = pin.substring(0, pin.length - 1);
            pinInput.value = pin;
            updateBoxes();
        }

        if (event.key === "Escape") {
            closeMenu();
        }
    });

    document.getElementById("pinArea").addEventListener("click", focusInput);
    boxes.forEach(function (box) {
        box.addEventListener("click", focusInput);
    });

    more.addEventListener("click", openMenu);
    cancel.addEventListener("click", closeMenu);
    scrim.addEventListener("click", closeMenu);

    reset.addEventListener("click", function () {
        clearPin();
        closeMenu();
    });

    document.getElementById("fingerprint").addEventListener("click", function () {
        alert("Fingerprint authentication is not available in this web demo.");
    });

    document.getElementById("password").addEventListener("click", function () {
        alert("Password sign-in is not available in this web demo.");
    });

    updateBoxes();
    focusInput();
})();
</script>
</body>
</html>
